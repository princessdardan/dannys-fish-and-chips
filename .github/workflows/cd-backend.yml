name: CD - Backend (Railway)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    # Only run if CI succeeded (for workflow_run) or if manually triggered
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
    - name: Check if backend files changed
      if: github.event_name == 'workflow_run'
      id: check_files
      uses: actions/github-script@v7
      with:
        script: |
          const files = await github.rest.repos.getCommit({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.payload.workflow_run.head_sha
          });

          const backendChanged = files.data.files.some(file =>
            file.filename.startsWith('backend/') ||
            file.filename === '.github/workflows/cd-backend.yml'
          );

          core.setOutput('backend_changed', backendChanged);

          if (!backendChanged) {
            core.notice('No backend files changed, skipping deployment');
          }

    - name: Skip if no backend changes
      if: github.event_name == 'workflow_run' && steps.check_files.outputs.backend_changed != 'true'
      run: |
        echo "No backend files changed, skipping deployment"
        exit 0

    - name: Checkout code
      if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

    - name: Setup Node.js
      if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Railway CLI
      if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true'
      run: npm install -g @railway/cli

    - name: Set Railway Environment
      if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true'
      id: railway_env
      run: |
        if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
          echo "service_name=${{ secrets.RAILWAY_STAGING_SERVICE }}" >> $GITHUB_OUTPUT
          echo "environment=staging" >> $GITHUB_OUTPUT
        else
          echo "service_name=${{ secrets.RAILWAY_PRODUCTION_SERVICE }}" >> $GITHUB_OUTPUT
          echo "environment=production" >> $GITHUB_OUTPUT
        fi

    - name: Run Database Migrations (Pre-deploy)
      if: (github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true') && github.event.inputs.skip_migrations != 'true'
      working-directory: ./backend
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "🔄 Running database migrations..."
        # Install dependencies
        npm ci

        # Get database credentials from Railway
        export DATABASE_URL=$(railway variables get DATABASE_URL -s ${{ steps.railway_env.outputs.service_name }} -e ${{ steps.railway_env.outputs.environment }} --project ${{ secrets.RAILWAY_PROJECT_ID }})
        export APP_KEYS=$(railway variables get APP_KEYS -s ${{ steps.railway_env.outputs.service_name }} -e ${{ steps.railway_env.outputs.environment }} --project ${{ secrets.RAILWAY_PROJECT_ID }})
        export API_TOKEN_SALT=$(railway variables get API_TOKEN_SALT -s ${{ steps.railway_env.outputs.service_name }} -e ${{ steps.railway_env.outputs.environment }} --project ${{ secrets.RAILWAY_PROJECT_ID }})
        export ADMIN_JWT_SECRET=$(railway variables get ADMIN_JWT_SECRET -s ${{ steps.railway_env.outputs.service_name }} -e ${{ steps.railway_env.outputs.environment }} --project ${{ secrets.RAILWAY_PROJECT_ID }})
        export JWT_SECRET=$(railway variables get JWT_SECRET -s ${{ steps.railway_env.outputs.service_name }} -e ${{ steps.railway_env.outputs.environment }} --project ${{ secrets.RAILWAY_PROJECT_ID }})

        # Build Strapi
        npm run build

        echo "✅ Database migrations completed"

    - name: Deploy to Railway
      if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true'
      working-directory: ./backend
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "🚀 Deploying to Railway (${{ steps.railway_env.outputs.environment }})..."
        railway up --service ${{ steps.railway_env.outputs.service_name }} --environment ${{ steps.railway_env.outputs.environment }} --project ${{ secrets.RAILWAY_PROJECT_ID }}
        echo "✅ Deployment triggered"

    - name: Wait for Railway Deployment
      if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true'
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "⏳ Waiting for deployment to complete..."
        sleep 30

        # Get deployment status
        deployment_id=$(railway status -s ${{ steps.railway_env.outputs.service_name }} -e ${{ steps.railway_env.outputs.environment }} --project ${{ secrets.RAILWAY_PROJECT_ID }} --json | jq -r '.latestDeployment.id')

        # Wait up to 5 minutes for deployment
        for i in {1..30}; do
          status=$(railway status -s ${{ steps.railway_env.outputs.service_name }} -e ${{ steps.railway_env.outputs.environment }} --project ${{ secrets.RAILWAY_PROJECT_ID }} --json | jq -r '.latestDeployment.status')

          if [ "$status" = "SUCCESS" ]; then
            echo "✅ Deployment completed successfully"
            exit 0
          elif [ "$status" = "FAILED" ] || [ "$status" = "CRASHED" ]; then
            echo "❌ Deployment failed with status: $status"
            exit 1
          fi

          echo "Current status: $status (attempt $i/30)"
          sleep 10
        done

        echo "⚠️ Deployment timeout - check Railway dashboard for status"
        exit 1

    - name: Health Check
      if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true'
      run: |
        # Get Railway URL
        if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
          url="${{ secrets.RAILWAY_STAGING_URL }}"
        else
          url="${{ secrets.RAILWAY_PRODUCTION_URL }}"
        fi

        echo "🏥 Running health check on $url..."

        # Wait for service to be ready
        for i in {1..12}; do
          if curl -sf "$url/_health" > /dev/null 2>&1; then
            echo "✅ Health check passed"
            exit 0
          fi
          echo "Waiting for service... (attempt $i/12)"
          sleep 5
        done

        echo "⚠️ Health check failed - service may still be starting"
        exit 1

    - name: Comment on commit
      if: (github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true') && github.event_name == 'workflow_run' && success()
      uses: actions/github-script@v7
      with:
        script: |
          const env = '${{ github.event.inputs.environment || 'production' }}';
          const url = env === 'staging' ? '${{ secrets.RAILWAY_STAGING_URL }}' : '${{ secrets.RAILWAY_PRODUCTION_URL }}';
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: '${{ github.event.workflow_run.head_sha }}',
            body: `✅ Backend deployed to **${env}**\n🔗 ${url}\n🔗 Admin: ${url}/admin`
          })

    - name: Deployment summary
      if: (github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true') && success()
      run: |
        echo "### 🚀 Backend Deployment Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment:** ${{ steps.railway_env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
          echo "- **URL:** ${{ secrets.RAILWAY_STAGING_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin:** ${{ secrets.RAILWAY_STAGING_URL }}/admin" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **URL:** ${{ secrets.RAILWAY_PRODUCTION_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin:** ${{ secrets.RAILWAY_PRODUCTION_URL }}/admin" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- **Commit:** ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Migrations:** ${{ github.event.inputs.skip_migrations == 'true' && 'Skipped' || 'Completed' }}" >> $GITHUB_STEP_SUMMARY

    - name: Rollback on failure
      if: (github.event_name == 'workflow_dispatch' || steps.check_files.outputs.backend_changed == 'true') && failure()
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "❌ Deployment failed - consider rolling back"
        echo "Run: railway rollback -s ${{ steps.railway_env.outputs.service_name }} -e ${{ steps.railway_env.outputs.environment }}"
