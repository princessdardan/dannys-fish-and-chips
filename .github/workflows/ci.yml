name: CI

# CI builds Strapi and Next.js using test-only env vars.
# This workflow does not deploy; it validates build, lint, and type checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "20"

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    # Build Strapi admin with test-only secrets and sqlite.
    - name: Build Strapi admin
      working-directory: ./backend
      run: npm run build
      env:
        NODE_ENV: production
        APP_KEYS: test-key-1,test-key-2
        API_TOKEN_SALT: test-token-salt
        ADMIN_JWT_SECRET: test-admin-secret
        TRANSFER_TOKEN_SALT: test-transfer-salt
        JWT_SECRET: test-jwt-secret
        ENCRYPTION_KEY: test-encryption-key
        DATABASE_CLIENT: sqlite
        DATABASE_FILENAME: .tmp/test.db

  frontend-ci:
    name: Frontend CI (Build)
    runs-on: ubuntu-latest
    needs: backend-ci
    permissions:
      statuses: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "20"

    # --- Start Strapi locally for build-time prerender ---
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    # Build Strapi admin with test-only secrets and sqlite.
    - name: Build Strapi admin
      working-directory: ./backend
      run: npm run build
      env:
        NODE_ENV: production
        APP_KEYS: test-key-1,test-key-2
        API_TOKEN_SALT: test-token-salt
        ADMIN_JWT_SECRET: test-admin-secret
        TRANSFER_TOKEN_SALT: test-transfer-salt
        JWT_SECRET: test-jwt-secret
        ENCRYPTION_KEY: test-encryption-key
        DATABASE_CLIENT: sqlite
        DATABASE_FILENAME: .tmp/test.db
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    # Start Strapi so Next.js can fetch during build.
    - name: Start Strapi
      working-directory: ./backend
      run: |
        nohup npm run start > strapi.log 2>&1 &
        echo $! > strapi.pid
      env:
        NODE_ENV: production
        APP_KEYS: test-key-1,test-key-2
        API_TOKEN_SALT: test-token-salt
        ADMIN_JWT_SECRET: test-admin-secret
        TRANSFER_TOKEN_SALT: test-transfer-salt
        JWT_SECRET: test-jwt-secret
        ENCRYPTION_KEY: test-encryption-key
        DATABASE_CLIENT: sqlite
        DATABASE_FILENAME: .tmp/test.db
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    # Fail fast if Strapi doesn't become ready.
    - name: Wait for Strapi
      run: |
        echo "Waiting for Strapi..."
        for i in {1..60}; do
          if curl -sf http://localhost:1337/admin > /dev/null 2>&1; then
            echo "Strapi is ready!"
            exit 0
          fi
          sleep 2
        done
        echo "Strapi failed to start"
        cat backend/strapi.log || true
        exit 1

    # --- Frontend build ---
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      env:
        MOTION_DEV_TOKEN: ${{ secrets.MOTION_DEV_TOKEN }}

    - name: Run linter
      working-directory: ./frontend
      run: npm run lint

    - name: Type check
      working-directory: ./frontend
      run: npx tsc --noEmit

    # Build with Strapi URL pointing at local CI instance.
    - name: Build Next.js application
      working-directory: ./frontend
      run: npm run build
      env:
        NEXT_PUBLIC_STRAPI_URL: http://localhost:1337

    # --- Cleanup + logs ---
    # Upload Strapi logs to help debug failed builds.
    - name: Upload frontend-ci logs on non-success
      if: ${{ always() && job.status != 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: frontend-ci-logs
        path: backend/strapi.log
        retention-days: 14

    - name: Cleanup processes
      if: always()
      run: |
        if [ -f backend/strapi.pid ]; then
          kill $(cat backend/strapi.pid) || true
          rm -f backend/strapi.pid
        fi

    - name: 'notify vercel'
      uses: 'vercel/repository-dispatch/actions/status@v1'
      with:
        name: 'Vercel - dannys-fish-and-chips: Frontend CI'
