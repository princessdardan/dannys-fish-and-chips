name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Test and build backend
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi admin
        run: npm run build
        env:
          NODE_ENV: production
          # Mock required environment variables for build
          APP_KEYS: test-key-1,test-key-2
          API_TOKEN_SALT: test-token-salt
          ADMIN_JWT_SECRET: test-admin-secret
          TRANSFER_TOKEN_SALT: test-transfer-salt
          JWT_SECRET: test-jwt-secret
          ENCRYPTION_KEY: test-encryption-key
          DATABASE_CLIENT: sqlite

  # Test and build frontend
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Initialize PostgreSQL database
        run: |
          PGPASSWORD=strapi psql -h localhost -U strapi -d strapi -c "SELECT 1;" || exit 1
          echo "PostgreSQL is accessible and ready"

      - name: Start Strapi backend
        working-directory: ./backend
        run: |
          npm run develop > strapi.log 2>&1 &
          STRAPI_PID=$!
          echo "Strapi started with PID $STRAPI_PID"
          echo $STRAPI_PID > strapi.pid
        env:
          NODE_ENV: development
          CI: true
          HOST: 0.0.0.0
          PORT: 1337
          APP_KEYS: test-key-1,test-key-2,test-key-3,test-key-4
          API_TOKEN_SALT: test-token-salt
          ADMIN_JWT_SECRET: test-admin-secret
          TRANSFER_TOKEN_SALT: test-transfer-salt
          JWT_SECRET: test-jwt-secret
          DATABASE_CLIENT: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: strapi
          DATABASE_USERNAME: strapi
          DATABASE_PASSWORD: strapi
          DATABASE_SSL: false
          DATABASE_SCHEMA: public

      - name: Wait for Strapi to be ready
        working-directory: ./backend
        run: |
          echo "Waiting for Strapi to start..."
          for i in {1..90}; do
            if curl -f http://localhost:1337/_health > /dev/null 2>&1; then
              echo "Strapi is ready!"
              exit 0
            fi
            echo "Attempt $i: Strapi not ready yet..."

            # Show last 10 lines of log every 10 attempts
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- Last 10 lines of Strapi log ---"
              tail -n 10 strapi.log 2>/dev/null || echo "No log file yet"
            fi

            # Check if Strapi process is still running
            if [ -f strapi.pid ]; then
              STRAPI_PID=$(cat strapi.pid)
              if ! ps -p $STRAPI_PID > /dev/null 2>&1; then
                echo "ERROR: Strapi process died!"
                echo "--- Full Strapi log ---"
                cat strapi.log 2>/dev/null || echo "No log file found"
                exit 1
              fi
            fi

            sleep 3
          done
          echo "Strapi failed to start within 270 seconds"
          echo "--- Full Strapi log ---"
          cat strapi.log 2>/dev/null || echo "No log file found"
          exit 1

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
          CI_BUILD: true

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_STRAPI_URL: http://localhost:1337

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  # Summary job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "CI pipeline failed"
            exit 1
          fi
          echo "All CI checks passed successfully!"
