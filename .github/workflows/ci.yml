name: CI

# CI builds the Next.js frontend backed by Sanity CMS.
# This workflow does not deploy; it validates build, lint, and type checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend CI (Build)
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "20"

    - name: Setup motion-plus package
      working-directory: ./frontend
      run: node scripts/setup-motion.mjs
      env:
        MOTION_DEV_TOKEN: ${{ secrets.MOTION_DEV_TOKEN }}

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      env:
        MOTION_DEV_TOKEN: ${{ secrets.MOTION_DEV_TOKEN }}

    - name: Run linter
      working-directory: ./frontend
      run: npm run lint

    - name: Type check
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Build Next.js application
      working-directory: ./frontend
      run: npm run build
      env:
        NEXT_PUBLIC_SANITY_PROJECT_ID: jz52wuvq
        NEXT_PUBLIC_SANITY_DATASET: production
        NEXT_PUBLIC_SANITY_API_VERSION: 2024-06-01
        SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

    - name: "notify vercel"
      uses: "vercel/repository-dispatch/actions/status@v1"
      with:
        name: "Vercel - dannys-fish-and-chips: Frontend CI"
