name: E2E Tests on Vercel Preview

# Runs Playwright against the Vercel Preview URL after successful deployment.
# Uses the deployment target URL as the base URL for tests.

on:
  deployment_status:

jobs:
  e2e-preview:
    name: E2E Tests on Preview Deployment
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        env:
          MOTION_DEV_TOKEN: ${{ secrets.MOTION_DEV_TOKEN }}

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      # The preview URL is provided by the deployment_status webhook payload.
      - name: Run E2E tests against Vercel preview
        working-directory: ./frontend
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}
          CI: true

      # Persist report artifacts for CI inspection.
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-report
          path: frontend/playwright-report/
          retention-days: 30

      # Post a short summary comment on the PR (if one exists).
      - name: Comment test results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.sha}`,
              state: 'open'
            });

            if (prs.length > 0) {
              const deploymentUrl = '${{ github.event.deployment_status.target_url }}';
              const testStatus = '${{ job.status }}';
              const emoji = testStatus === 'success' ? '✅' : '❌';

              await github.rest.issues.createComment({
                issue_number: prs[0].number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `${emoji} E2E tests ${testStatus} on preview deployment\n\nDeployment: ${deploymentUrl}`
              });
            }
