name: CD - Frontend (Vercel)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check if frontend files changed
        if: github.event_name == 'workflow_run'
        id: check_files
        uses: actions/github-script@v7
        with:
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha
            });

            const frontendChanged = commit.data.files.some(file =>
              file.filename.startsWith('frontend/') ||
              file.filename === '.github/workflows/cd-frontend.yml'
            );

            core.setOutput('frontend_changed', frontendChanged ? 'true' : 'false');
            core.info(`Frontend changed: ${frontendChanged}`);

      - name: Skip deploy (no frontend changes)
        if: github.event_name == 'workflow_run' && steps.check_files.outputs.frontend_changed != 'true'
        run: echo "No frontend changes detected. Skipping deployment."

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assert node/npm present
        if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.frontend_changed == 'true'
        run: |
          echo "PATH=$PATH"
          command -v node
          command -v npm
          node -v
          npm -v

      - name: Install Vercel CLI
        if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.frontend_changed == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.frontend_changed == 'true'
        working-directory: ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          if [ "$ENV" = "staging" ]; then
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy to Vercel (remote build)
        if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.frontend_changed == 'true'
        id: deploy
        working-directory: ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_STRAPI_URL: ${{ (github.event.inputs.environment || 'production') == 'staging' && secrets.RAILWAY_STAGING_URL || secrets.RAILWAY_PRODUCTION_URL }}
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"

          if [ "$ENV" = "staging" ]; then
            url=$(vercel deploy --yes \
              --token=${{ secrets.VERCEL_TOKEN }} \
              --build-env NEXT_PUBLIC_STRAPI_URL="$NEXT_PUBLIC_STRAPI_URL" \
              --env NEXT_PUBLIC_STRAPI_URL="$NEXT_PUBLIC_STRAPI_URL")
          else
            url=$(vercel deploy --yes --prod \
              --token=${{ secrets.VERCEL_TOKEN }} \
              --build-env NEXT_PUBLIC_STRAPI_URL="$NEXT_PUBLIC_STRAPI_URL" \
              --env NEXT_PUBLIC_STRAPI_URL="$NEXT_PUBLIC_STRAPI_URL")
          fi

          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"

      - name: Comment on commit
        if: (github.event_name == 'workflow_dispatch' || steps.check_files.outputs.frontend_changed == 'true') && github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const env = '${{ github.event.inputs.environment || 'production' }}';

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ github.event.workflow_run.head_sha }}',
              body: `✅ Frontend deployed to **${env}**\n🔗 ${url}`
            });

      - name: Deployment summary
        if: github.event_name == 'workflow_dispatch' || steps.check_files.outputs.frontend_changed == 'true'
        run: |
          echo "### Frontend Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> $GITHUB_STEP_SUMMARY
