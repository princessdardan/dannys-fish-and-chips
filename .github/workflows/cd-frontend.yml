name: CD - Frontend (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/cd-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Pull Vercel Environment Information
      working-directory: ./frontend
      run: |
        if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        else
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        fi

    - name: Build Project Artifacts
      working-directory: ./frontend
      run: vercel build ${{ github.event.inputs.environment == 'staging' && '' || '--prod' }} --token=${{ secrets.VERCEL_TOKEN }}

    - name: Deploy to Vercel
      id: deploy
      working-directory: ./frontend
      run: |
        if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
        else
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
        fi
        echo "url=$url" >> $GITHUB_OUTPUT
        echo "🚀 Deployed to: $url"

    - name: Comment on commit
      if: github.event_name == 'push'
      uses: actions/github-script@v7
      with:
        script: |
          const url = '${{ steps.deploy.outputs.url }}';
          const env = '${{ github.event.inputs.environment || 'production' }}';
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: `✅ Frontend deployed to **${env}**\n🔗 ${url}`
          })

    - name: Deployment summary
      run: |
        echo "### 🚀 Frontend Deployment Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
